name: Publish Newsletter Edition
on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:
concurrency:
  group: publish-newsletter-edition
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish to the production Supabase store
        env:
          NEWSLETTER_PUBLIC_URL: ${{ vars.NEWSLETTER_PUBLIC_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node examples/trigger-publication.js
